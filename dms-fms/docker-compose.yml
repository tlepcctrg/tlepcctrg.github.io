version: "3.9"

# Infrastructure for the DMS/FMS reference architecture. MongoDB backs the
# metadata & hierarchy store, Redis backs the L2 permission cache, Kafka is
# the domain event bus, and MinIO provides an S3-compatible object storage
# target for FMS's pre-signed URL flows (works interchangeably with real
# AWS S3 by swapping FMS.Api's Storage:ServiceUrl configuration).
services:
  mongodb:
    image: mongo:7
    container_name: dms-fms-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: dms-fms-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  kafka:
    image: apache/kafka:3.8.0
    container_name: dms-fms-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: "dms-fms-kafka-cluster-1"
    volumes:
      - kafka-data:/var/lib/kafka/data

  minio:
    image: minio/minio:latest
    container_name: dms-fms-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  # One-shot job that creates the temp/permanent buckets FMS.Api expects.
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (mc alias set local http://minio:9000 minioadmin minioadmin) do sleep 1; done;
      mc mb -p local/dms-fms-temp local/dms-fms-permanent;
      mc anonymous set none local/dms-fms-temp local/dms-fms-permanent;
      exit 0;
      "

volumes:
  mongo-data:
  redis-data:
  kafka-data:
  minio-data:
